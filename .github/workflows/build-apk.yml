name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build Vite web app
        run: npm run build

      - name: Initialize & sync Android project
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.meloucasalta.petalsort",
            "appName": "PetalSort",
            "webDir": "dist"
          }
          EOF
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          mkdir -p android/app/libs android/capacitor-cordova-android-plugins/src/main/libs

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee gradle.log || {
            echo "=== ROOT CAUSE SUMMARY ==="
            grep -E "FAILURE:|Execution failed for task|Caused by:|> " gradle.log | tail -n 30
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetalSort-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
